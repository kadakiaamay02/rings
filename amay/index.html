<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Channel-Set Band Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: jeweler's bench. Live 3D stage on the left, spec sheet of controls on the right; stacks on phones. */
:root{
  --bg:#E8ECE9; --panel:#F6F8F6; --ink:#18201C; --muted:#5B6660; --line:#D2DAD5;
  --accent:#1D6A4C; --accent-ink:#FFFFFF; --stage-hi:#F4F6F3; --stage-lo:#D9DFDA; --chip:#FFFFFFCC;
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --panel:#161B18; --ink:#E6ECE8; --muted:#95A29B; --line:#28312C;
    --accent:#5CC79A; --accent-ink:#0B1410; --stage-hi:#1C2420; --stage-lo:#090C0A; --chip:#161B18CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --panel:#161B18; --ink:#E6ECE8; --muted:#95A29B; --line:#28312C;
  --accent:#5CC79A; --accent-ink:#0B1410; --stage-hi:#1C2420; --stage-lo:#090C0A; --chip:#161B18CC;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 384px;height:100%}

/* Stage */
.stage{position:relative;min-width:0;height:100%;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 42%, var(--stage-hi), var(--stage-lo) 78%)}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#viewport canvas:active{cursor:grabbing}
.stage-head{position:absolute;top:0;left:0;right:0;pointer-events:none;
  padding-block:22px 0;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:24px;
  display:grid;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.view-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  padding-block:0 18px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:16px}
.chip{border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gl-error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* Panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0;
  padding-block:20px 32px;padding-left:22px;padding-right:max(22px, env(safe-area-inset-right,0px))}
.section{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line)}
.section:first-child{border-top:0;padding-top:0}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px}
.label output{color:var(--ink);letter-spacing:0;text-transform:none;font-size:12px;font-variant-numeric:tabular-nums}

.spec{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:5px;
  font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.spec dt{color:var(--muted)}
.spec dd{margin:0;text-align:right;overflow-wrap:anywhere}
.spec .weight{font-family:var(--f-display);font-size:30px;line-height:1;text-align:left;grid-column:1/-1;margin-bottom:6px}
.spec .weight small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{font-size:12.5px;color:var(--muted)}

.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:transparent;
  padding:7px 8px;cursor:pointer;text-align:left;font-size:12.5px;line-height:1.2;min-width:0}
.swatch:hover{border-color:var(--muted)}
.swatch[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.dot.gem{border-radius:3px;width:12px;height:20px;transform:skewX(0)}
.dot.none{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 5px)}

.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:7px;padding:7px 6px;font-size:13px;font-weight:500;cursor:pointer}
.seg button:hover{background:var(--bg)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}

input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:-4px}
select,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.sub{display:grid;gap:8px}

@media (max-width: 840px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .stage{height:min(66vh, 560px)}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .stage-head{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:16px;padding-top:16px}
  .hint{display:none}
}
@media (max-width: 380px){ .swatches{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>

<div class="app">
  <section class="stage" aria-label="3D ring preview">
    <div id="viewport"></div>
    <header class="stage-head">
      <span class="eyebrow">Baguette channel band</span>
      <h1>Channel-Set Band</h1>
      <p class="hint">Drag to turn it. Scroll or pinch to zoom.</p>
    </header>
    <nav class="view-bar" aria-label="Camera">
      <button class="chip" data-view="three" type="button">Three-quarter</button>
      <button class="chip" data-view="front" type="button">Front</button>
      <button class="chip" data-view="inside" type="button">Inside</button>
      <button class="chip" data-view="top" type="button">Top</button>
      <button class="chip" id="spin" type="button" aria-pressed="true">Spin</button>
    </nav>
  </section>

  <aside class="panel" aria-label="Ring options">
    <div class="section">
      <p class="label">Specification</p>
      <dl class="spec" id="spec"></dl>
      <div class="row">
        <button class="btn primary" id="copy" type="button">Copy spec</button>
        <button class="btn" id="reset" type="button">Reset to photo</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </div>

    <div class="section">
      <p class="label" id="metalLbl">Metal</p>
      <div class="swatches" id="metalSw" role="radiogroup" aria-labelledby="metalLbl"></div>
    </div>

    <div class="section">
      <p class="label" id="finishLbl">Finish</p>
      <div class="seg" id="finishSeg" role="radiogroup" aria-labelledby="finishLbl"></div>
      <p class="label" id="profileLbl">Profile</p>
      <div class="seg" id="profileSeg" role="radiogroup" aria-labelledby="profileLbl"></div>
    </div>

    <div class="section">
      <div class="sub">
        <label class="label" for="size">Ring size <output id="sizeOut"></output></label>
        <select id="size"></select>
      </div>
      <div class="sub">
        <label class="label" for="width">Band width <output id="widthOut"></output></label>
        <input type="range" id="width" min="3" max="10" step="0.5">
        <div class="scale"><span>3 mm</span><span>10 mm</span></div>
      </div>
      <div class="sub">
        <label class="label" for="thick">Thickness <output id="thickOut"></output></label>
        <input type="range" id="thick" min="1.5" max="3" step="0.1">
        <div class="scale"><span>1.5 mm</span><span>3.0 mm</span></div>
      </div>
    </div>

    <div class="section">
      <p class="label" id="stoneLbl">Stone</p>
      <div class="swatches" id="stoneSw" role="radiogroup" aria-labelledby="stoneLbl"></div>
      <div class="sub" id="stoneOpts">
        <p class="label" id="countLbl">Number of stones</p>
        <div class="seg" id="countSeg" role="radiogroup" aria-labelledby="countLbl"></div>
        <label class="label" for="bag">Baguette width <output id="bagOut"></output></label>
        <input type="range" id="bag" min="1" max="3.5" step="0.1">
        <div class="scale"><span>1.0 mm</span><span>3.5 mm</span></div>
      </div>
    </div>

    <div class="section">
      <label class="label" for="engrave">Inside engraving <output id="engraveOut"></output></label>
      <input type="text" id="engrave" maxlength="22" placeholder="e.g. Always · 06.14.26" autocomplete="off">
      <div class="seg" id="styleSeg" role="radiogroup" aria-label="Engraving style"></div>
      <p class="note">Shows on the inner wall opposite the stone. Use the Inside view to read it.</p>
    </div>
  </aside>
</div>

<script>window.__SAVED={"metal":"yellow","finish":"satin","profile":"flat","width":6,"thick":2.5,"size":10,"stone":"diamond","count":1,"bag":1.6,"engrave":"","engraveStyle":"script"};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const KEY = 'band-studio-v1';
const METALS = {
  rose:     {label:'Rose gold',   long:'14k rose gold',   color:'#E9A083', density:13.0},
  yellow:   {label:'Yellow gold', long:'14k yellow gold', color:'#F1C36A', density:13.1},
  white:    {label:'White gold',  long:'14k white gold',  color:'#E0DFD8', density:12.9},
  platinum: {label:'Platinum',    long:'platinum 950',    color:'#CECCC7', density:20.7},
  titanium: {label:'Titanium',    long:'titanium',        color:'#A29D97', density:4.5},
  tungsten: {label:'Black tungsten', long:'black tungsten carbide', color:'#3A3838', density:15.6}
};
const STONES = {
  emerald:  {label:'Emerald',    color:'#1F8A57', opacity:0.82, density:2.72},
  moss:     {label:'Moss agate', color:'#5F7E5B', opacity:0.96, density:2.6},
  sapphire: {label:'Sapphire',   color:'#2142AA', opacity:0.82, density:4.0},
  ruby:     {label:'Ruby',       color:'#B3143C', opacity:0.82, density:4.0},
  diamond:  {label:'Diamond',    color:'#F2F6FA', opacity:0.5,  density:3.52},
  onyx:     {label:'Black onyx', color:'#151515', opacity:1,    density:2.65},
  none:     {label:'No stone'}
};
const FINISH = {
  polished:{label:'Polished', rough:0.12, bump:0},
  satin:   {label:'Satin',    rough:0.32, bump:0.008},
  brushed: {label:'Brushed',  rough:0.42, bump:0.025}
};
const PROFILES = {flat:'Flat', comfort:'Comfort fit', domed:'Domed'};
const COUNTS = {1:'1', 3:'3', 5:'5', 7:'7'};
const STYLES = {script:'Script', block:'Block'};
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEFAULTS = {metal:'rose', finish:'polished', profile:'flat', width:6, thick:2, size:10,
  stone:'emerald', count:1, bag:1.6, engrave:'', engraveStyle:'script', spin:!reduceMotion};

function loadSaved(){
  try{
    const s = window.__SAVED;
    if(!s || typeof s !== 'object') return {};
    const out = {};
    if(METALS[s.metal]) out.metal = s.metal;
    if(FINISH[s.finish]) out.finish = s.finish;
    if(PROFILES[s.profile]) out.profile = s.profile;
    if(STONES[s.stone]) out.stone = s.stone;
    if(COUNTS[s.count]) out.count = +s.count;
    if(STYLES[s.engraveStyle]) out.engraveStyle = s.engraveStyle;
    ['width','thick','size','bag'].forEach(k=>{ if(typeof s[k]==='number' && isFinite(s[k])) out[k]=s[k]; });
    if(typeof s.engrave==='string') out.engrave = s.engrave.slice(0,22);
    if(typeof s.spin==='boolean') out.spin = s.spin;
    return out;
  }catch(e){ return {}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const state = Object.assign({}, DEFAULTS, loadSaved());
window.__getState=()=>state;

const $ = id => document.getElementById(id);
const innerDiameter = s => 11.63 + 0.8128*s;   // US size to inner diameter in mm
const fmt = (n,d=1) => n.toFixed(d);

/* ---------- Controls ---------- */
function radioGroup(el, options, key, render){
  el.innerHTML = '';
  Object.entries(options).forEach(([val, opt])=>{
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role','radio'); b.dataset.val = val;
    render ? render(b, val, opt) : (b.textContent = typeof opt === 'string' ? opt : opt.label);
    b.addEventListener('click', ()=>{
      state[key] = (key === 'count') ? +val : val;
      sync(); rebuild();
    });
    el.appendChild(b);
  });
}
radioGroup($('metalSw'), METALS, 'metal', (b,v,o)=>{
  b.className = 'swatch';
  b.innerHTML = `<span class="dot" style="background:radial-gradient(circle at 35% 30%, #fff8 0, ${o.color} 45%, ${o.color})"></span><span>${o.label}</span>`;
});
radioGroup($('stoneSw'), STONES, 'stone', (b,v,o)=>{
  b.className = 'swatch';
  b.innerHTML = v === 'none'
    ? `<span class="dot gem none"></span><span>${o.label}</span>`
    : `<span class="dot gem" style="background:linear-gradient(160deg, #fff6, ${o.color} 40%, ${o.color})"></span><span>${o.label}</span>`;
});
radioGroup($('finishSeg'), FINISH, 'finish');
radioGroup($('profileSeg'), PROFILES, 'profile');
radioGroup($('countSeg'), COUNTS, 'count');
radioGroup($('styleSeg'), STYLES, 'engraveStyle');

const sizeSel = $('size');
for(let s=4; s<=15; s+=0.5){
  const o = document.createElement('option');
  o.value = s; o.textContent = `US ${s}  ·  Ø ${fmt(innerDiameter(s),2)} mm  ·  EU ${Math.round(Math.PI*innerDiameter(s))}`;
  sizeSel.appendChild(o);
}
sizeSel.addEventListener('change', ()=>{ state.size = +sizeSel.value; sync(); rebuild(true); });
['width','thick','bag'].forEach(k=>{
  $(k).addEventListener('input', ()=>{ state[k] = +$(k).value; sync(); rebuild(); });
});
let engraveTimer;
$('engrave').addEventListener('input', ()=>{
  state.engrave = $('engrave').value; sync();
  clearTimeout(engraveTimer); engraveTimer = setTimeout(rebuild, 120);
});

function sync(){
  document.querySelectorAll('[role=radio]').forEach(b=>{
    const g = b.parentElement.id;
    const key = {metalSw:'metal', stoneSw:'stone', finishSeg:'finish', profileSeg:'profile', countSeg:'count', styleSeg:'engraveStyle'}[g];
    b.setAttribute('aria-checked', String(String(state[key]) === b.dataset.val));
  });
  sizeSel.value = state.size;
  $('width').value = state.width; $('thick').value = state.thick; $('bag').value = state.bag;
  if($('engrave').value !== state.engrave) $('engrave').value = state.engrave;
  $('sizeOut').textContent = `US ${state.size}`;
  $('widthOut').textContent = `${fmt(state.width)} mm`;
  $('thickOut').textContent = `${fmt(state.thick)} mm`;
  $('bagOut').textContent = `${fmt(state.bag)} mm`;
  $('engraveOut').textContent = `${state.engrave.length}/22`;
  $('stoneOpts').hidden = state.stone === 'none';
  $('spin').setAttribute('aria-pressed', String(state.spin));
  save();
}

/* ---------- Geometry ---------- */
// Closed ring cross-section in (radius, height) space, counter-clockwise, with eased corners.
function profile(rIn, rOut, a, e, cc, dd){
  const rc = (rIn+rOut)/2, b = (rOut-rIn)/2;
  e = Math.min(e, b*0.9, a*0.9);
  const pts = [], N = 28, C = 8, T = 6;
  const corner = (cx, cy, a0)=>{ for(let i=1;i<=C;i++){ const t = a0 + (Math.PI/2)*i/C; pts.push([cx+e*Math.cos(t), cy+e*Math.sin(t)]); } };
  for(let i=0;i<=N;i++) pts.push([rc+b, -a+e + 2*(a-e)*i/N]);
  corner(rc+b-e, a-e, 0);
  for(let i=1;i<=T;i++) pts.push([rc+b-e - 2*(b-e)*i/T, a]);
  corner(rc-b+e, a-e, Math.PI/2);
  for(let i=1;i<=N;i++) pts.push([rc-b, a-e - 2*(a-e)*i/N]);
  corner(rc-b+e, -a+e, Math.PI);
  for(let i=1;i<=T;i++) pts.push([rc-b+e + 2*(b-e)*i/T, -a]);
  corner(rc+b-e, -a+e, 3*Math.PI/2);
  return pts.map(([r,y])=>{
    const k = (y/a)*(y/a);
    if(r > rc) r -= dd*k*((r-rc)/b); else r += cc*k*((rc-r)/b);
    return [r,y];
  });
}
function areaCentroid(pts){
  let A=0, cx=0;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1], cr = x0*y1 - x1*y0;
    A += cr; cx += (x0+x1)*cr;
  }
  A /= 2; cx /= (6*A);
  return {A:Math.abs(A), cx};
}
function baguetteGeo(L, W, H){
  const bs = Math.min(L, W)*0.16, bt = H*0.22;
  const hl = L/2 - bs, hw = W/2 - bs;
  const sh = new THREE.Shape();
  sh.moveTo(-hl,-hw); sh.lineTo(hl,-hw); sh.lineTo(hl,hw); sh.lineTo(-hl,hw); sh.lineTo(-hl,-hw);
  const g = new THREE.ExtrudeGeometry(sh, {depth:Math.max(0.05, H-2*bt), bevelEnabled:true, bevelThickness:bt, bevelSize:bs, bevelSegments:2, curveSegments:1});
  g.computeBoundingBox();
  const bb = g.boundingBox;
  g.translate(-(bb.min.x+bb.max.x)/2, -(bb.min.y+bb.max.y)/2, -bb.min.z);
  return g;
}
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

/* ---------- Three.js scene ---------- */
const viewport = $('viewport');
let renderer;
try{
  if(!window.THREE || !THREE.OrbitControls) throw new Error('lib');
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
}catch(err){
  viewport.innerHTML = '<div class="gl-error">The 3D view could not start in this browser. The spec and options still work.</div>';
}

let scene, camera, controls, ringGroup, shadow, brushTex, mats = [], Rcur = 12;
let model = {};

if(renderer){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  viewport.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, 1, 0.5, 2000);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enablePan = false; controls.autoRotateSpeed = 1.1;

  // Studio environment: softboxes in a dim room, baked to a reflection map.
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(100,60,100), new THREE.MeshBasicMaterial({color:new THREE.Color(0.16,0.165,0.17), side:THREE.BackSide})));
  const panel = (w,h,pos,c)=>{ const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:c, side:THREE.DoubleSide})); m.position.set(...pos); m.lookAt(0,0,0); env.add(m); };
  panel(60,22,[0,29,0], new THREE.Color(6,6,6));
  panel(9,44,[-48,4,12], new THREE.Color(5,5,5));
  panel(9,44,[48,4,-12], new THREE.Color(4,4,4.3));
  panel(46,12,[0,-6,48], new THREE.Color(2.6,2.3,2.1));
  panel(34,9,[6,12,-48], new THREE.Color(3,3,3));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshBasicMaterial({color:new THREE.Color(0.04,0.04,0.045), side:THREE.DoubleSide}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -29; env.add(floor);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
  pm.dispose();

  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(10, 30, 25); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(-20, 10, -25); scene.add(rim);

  // Fine circumferential lines for brushed and satin finishes.
  const bc = document.createElement('canvas'); bc.width = 4; bc.height = 512;
  const bx = bc.getContext('2d');
  for(let y=0;y<512;y++){ const v = 100 + (Math.random()*80|0); bx.fillStyle = `rgb(${v},${v},${v})`; bx.fillRect(0,y,4,1); }
  brushTex = new THREE.CanvasTexture(bc);
  brushTex.wrapS = brushTex.wrapT = THREE.RepeatWrapping; brushTex.repeat.set(1, 3);

  // Soft contact shadow on the bench.
  const sc = document.createElement('canvas'); sc.width = sc.height = 256;
  const sx = sc.getContext('2d');
  const grd = sx.createRadialGradient(128,128,40,128,128,128);
  grd.addColorStop(0,'rgba(0,0,0,0.42)'); grd.addColorStop(0.55,'rgba(0,0,0,0.22)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  sx.fillStyle = grd; sx.fillRect(0,0,256,256);
  shadow = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc), transparent:true, depthWrite:false, toneMapped:false}));
  shadow.rotation.x = -Math.PI/2; scene.add(shadow);

  ringGroup = new THREE.Group(); scene.add(ringGroup);

  new ResizeObserver(()=>{
    const w = viewport.clientWidth, h = viewport.clientHeight;
    if(!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }).observe(viewport);
}

function clearRing(){
  while(ringGroup.children.length){
    const c = ringGroup.children.pop();
    c.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  }
  mats.forEach(m=>{ if(m.alphaMap) m.alphaMap.dispose(); m.dispose(); });
  mats = [];
}

function computeModel(){
  const s = state, Ri = innerDiameter(s.size)/2, t = s.thick, a = s.width/2, Ro = Ri + t;
  const e = Math.min(0.35, t*0.25, a*0.3);
  const cc = s.profile === 'comfort' ? Math.min(0.45, t*0.24) : 0;
  const dd = s.profile === 'domed' ? t*0.36 : 0;
  const main = profile(Ri, Ro, a, e, cc, dd);
  const stoneOn = s.stone !== 'none';
  const n = stoneOn ? s.count : 0, L = s.bag;
  const floorTop = Ri + Math.max(0.55, t*0.3) + cc;
  const stoneTop = Ro - 0.12;
  const H = Math.max(0.3, stoneTop - floorTop);
  const Wg = s.profile === 'domed' ? 2*a*0.62 : 2*a - 2*Math.max(0.3, e*0.9);
  const gapW = (L + 0.2)/Ro, step = (L + 1.1)/Ro;
  const gaps = [];
  for(let k=0;k<n;k++){ const c = (k - (n-1)/2)*step; gaps.push([c - gapW/2, c + gapW/2, c]); }

  const {A, cx} = areaCentroid(main);
  let vol = 2*Math.PI*cx*A;
  vol -= n * (L+0.2) * Wg * (Ro - floorTop);
  const metalG = vol/1000 * METALS[s.metal].density;
  const ct = stoneOn ? n * (L*Wg*H*0.82/1000) * STONES[s.stone].density * 5 : 0;
  return {Ri, Ro, a, e, cc, dd, main, n, L, floorTop, stoneTop, H, Wg, gapW, gaps, metalG, ct};
}

function engravingMesh(m, color){
  const text = state.engrave.trim();
  if(!text) return null;
  const px = 72, h = 112;
  const font = state.engraveStyle === 'script' ? `${px}px "Pinyon Script", "Snell Roundhand", cursive` : `600 ${Math.round(px*0.7)}px Manrope, system-ui, sans-serif`;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d');
  cx.font = font;
  const w = Math.ceil(cx.measureText(text).width) + 48;
  cv.width = w; cv.height = h;
  cx.fillStyle = '#000'; cx.fillRect(0,0,w,h);
  cx.font = font; cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if(state.engraveStyle === 'block'){ try{ cx.letterSpacing = '4px'; }catch(e){} }
  cx.fillText(text, w/2, h/2 + 4);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; tex.offset.x = 1;   // read correctly from inside the ring
  const hmm = Math.min(m.a*2*0.5, 2.6), R = m.Ri - 0.015;
  const span = Math.min((w * hmm/h)/R, Math.PI*1.6);
  const mat = new THREE.MeshStandardMaterial({color, metalness:1, roughness:0.62, alphaMap:tex, transparent:true, side:THREE.BackSide, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2});
  mats.push(mat);
  return new THREE.Mesh(new THREE.CylinderGeometry(R, R, hmm, 96, 1, true, Math.PI - span/2, span), mat);
}

function rebuild(resetView){
  model = computeModel();
  renderSpec();
  if(!renderer) return;
  clearRing();
  const m = model, M = METALS[state.metal], F = FINISH[state.finish], tung = state.metal === 'tungsten';
  const metalMat = new THREE.MeshStandardMaterial({
    color: lin(M.color), metalness: tung ? 0.8 : 1, roughness: Math.min(1, F.rough + (tung ? 0.1 : 0)),
    envMapIntensity: 1.25, bumpMap: F.bump ? brushTex : null, bumpScale: F.bump, side: THREE.DoubleSide
  });
  mats.push(metalMat);
  const v2 = m.main.map(p=>new THREE.Vector2(p[0], p[1]));
  const lathe = (pts, start, len)=> new THREE.Mesh(new THREE.LatheGeometry(pts, Math.max(4, Math.ceil(len/(2*Math.PI)*220)), start, len), metalMat);

  if(!m.gaps.length){
    ringGroup.add(lathe(v2, 0, Math.PI*2));
  } else {
    const shape = new THREE.Shape(m.main.slice(0,-1).map(p=>new THREE.Vector2(p[0], p[1])));
    const capGeo = new THREE.ShapeGeometry(shape);
    const cap = phi => { const c = new THREE.Mesh(capGeo.clone(), metalMat); c.rotation.y = phi - Math.PI/2; ringGroup.add(c); };
    m.gaps.forEach((g, i)=>{
      const start = g[1], end = i < m.gaps.length-1 ? m.gaps[i+1][0] : m.gaps[0][0] + Math.PI*2;
      ringGroup.add(lathe(v2, start, end - start));
      cap(start); cap(end);
    });
    capGeo.dispose();

    const floorPts = profile(m.Ri, m.floorTop, m.a, Math.min(m.e, (m.floorTop - m.Ri)*0.45), m.cc, 0).map(p=>new THREE.Vector2(p[0], p[1]));
    const S = STONES[state.stone];
    const stoneMat = new THREE.MeshPhysicalMaterial({
      color: lin(S.color), metalness: 0, roughness: 0.03, clearcoat: 1, clearcoatRoughness: 0.02,
      transparent: S.opacity < 1, opacity: S.opacity, flatShading: true, envMapIntensity: 2.4,
      emissive: lin(S.color).multiplyScalar(state.stone === 'onyx' ? 0 : 0.1), reflectivity: 1
    });
    mats.push(stoneMat);
    const sg = baguetteGeo(m.L, m.Wg, m.H);
    m.gaps.forEach(g=>{
      ringGroup.add(lathe(floorPts, g[0], g[1] - g[0]));
      const holder = new THREE.Group(); holder.rotation.y = g[2];
      const st = new THREE.Mesh(sg, stoneMat); st.position.z = m.floorTop + 0.01;
      holder.add(st); ringGroup.add(holder);
    });
  }

  const eng = engravingMesh(m, lin(M.color).multiplyScalar(0.35));
  if(eng) ringGroup.add(eng);

  shadow.scale.set(m.Ro*2.9, m.Ro*2.9, 1);
  shadow.position.y = -m.a - 0.02;
  controls.minDistance = m.Ro*2.4; controls.maxDistance = m.Ro*11;
  const changedSize = Math.abs(m.Ro - Rcur) > 0.01;
  Rcur = m.Ro;
  if(resetView === 'init') setView('three', true);
  else if(changedSize && resetView){ camera.position.setLength(m.Ro*5.4); }
}

/* ---------- Camera views ---------- */
const VIEWS = {three:[0.34,0.42,0.84], front:[0,0.08,1], inside:[0,0.84,0.54], top:[0,1,0.0001]};
let tween = null, activeView = 'three';
function setView(name, instant){
  if(!renderer) return;
  activeView = name;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const to = new THREE.Vector3(...VIEWS[name]).normalize().multiplyScalar(Rcur*5.4);
  if(instant || reduceMotion){ camera.position.copy(to); controls.target.set(0,0,0); controls.update(); tween = null; return; }
  tween = {from: camera.position.clone(), to, t: 0};
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.view)));
$('spin').addEventListener('click', ()=>{ state.spin = !state.spin; sync(); });
if(renderer) controls.addEventListener('start', ()=>{
  tween = null;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));
});

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if(tween){
    tween.t = Math.min(1, tween.t + dt/0.75);
    const k = tween.t < 0.5 ? 4*tween.t**3 : 1 - Math.pow(-2*tween.t + 2, 3)/2;
    camera.position.lerpVectors(tween.from, tween.to, k);
    if(tween.t >= 1) tween = null;
  }
  controls.autoRotate = state.spin && !tween;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------- Spec sheet ---------- */
function specLines(){
  const m = model, M = METALS[state.metal], d = innerDiameter(state.size);
  const lines = [
    ['Metal', `${M.long}, ${FINISH[state.finish].label.toLowerCase()}`],
    ['Profile', PROFILES[state.profile]],
    ['Band', `${fmt(state.width)} × ${fmt(state.thick)} mm`],
    ['Size', `US ${state.size} · EU ${Math.round(Math.PI*d)}`],
    ['Inner Ø', `${fmt(d,2)} mm`]
  ];
  if(state.stone !== 'none'){
    lines.push(['Stones', `${m.n} × ${STONES[state.stone].label.toLowerCase()} baguette`]);
    lines.push(['Stone size', `${fmt(m.L)} × ${fmt(m.Wg)} mm, ≈${fmt(m.ct,2)} ct total`]);
  } else lines.push(['Stones', 'none']);
  lines.push(['Engraving', state.engrave.trim() ? `“${state.engrave.trim()}” (${STYLES[state.engraveStyle].toLowerCase()})` : 'none']);
  return lines;
}
function renderSpec(){
  const dl = $('spec');
  dl.innerHTML = '';
  const w = document.createElement('dd'); w.className = 'weight';
  w.innerHTML = `${fmt(model.metalG)} g<small>est. metal weight</small>`;
  dl.appendChild(w);
  specLines().forEach(([k,v])=>{
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd);
  });
}
$('copy').addEventListener('click', ()=>{
  const text = ['Channel-set band', ...specLines().map(([k,v])=>`${k}: ${v}`), `Est. metal weight: ${fmt(model.metalG)} g`].join('\n');
  const fallback = ()=>{
    const r = document.createRange(); r.selectNodeContents($('spec'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    $('status').textContent = 'Spec selected. Press Ctrl+C or ⌘C to copy.';
  };
  try{
    navigator.clipboard.writeText(text).then(()=>{ $('status').textContent = 'Copied'; setTimeout(()=>$('status').textContent='', 2200); }, fallback);
  }catch(e){ fallback(); }
});
$('reset').addEventListener('click', ()=>{
  Object.assign(state, DEFAULTS, {spin: state.spin});
  sync(); rebuild(true); setView('three');
});

/* ---------- Start ---------- */
sync();
rebuild('init');
if(renderer) requestAnimationFrame(loop);
if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('72px "Pinyon Script"'), document.fonts.load('600 50px Manrope')])
    .then(()=>{ if(state.engrave) rebuild(); }).catch(()=>{});
}
})();
</script>

</body></html>
